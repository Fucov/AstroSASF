[project]
name = "AstroSASF"
version = "7.2.0"
description = "Astro Scientific Agent Scheduling Framework — 面向太空实验室的科学智能体调度框架"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
]

[project.scripts]
astrosasf-demo = "demo.demo_mission:main"
astrosasf-server = "interface.server:app"
astrosasf-bench-gen = "benchmarks.bench_generator:main"
astrosasf-bench-run = "benchmarks.bench_suite:main"
astrosasf-compare = "experiments.comparator:main"
astrosasf-ablate = "experiments.ablator:main"
astrosasf-plot = "experiments.plotter:main"
astrosasf-validate = "quick_validation:main"
