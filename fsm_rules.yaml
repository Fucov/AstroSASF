# ============================================================================ #
#  AstroSASF — V7.1 联锁规则配置                                                #
#  正交子系统状态 + 跨系统联锁规则（应用层定义，框架加载）                           #
# ============================================================================ #

# 子系统定义：每个子系统独立维护自己的状态空间
subsystems:
  # 原有子系统
  thermal:  [IDLE, HEATING, COOLING]
  vacuum:   [IDLE, ACTIVE]
  arm:      [IDLE, MOVING]
  
  # V7.1 新增子系统
  life_support: [IDLE, VENTILATING]    # 通风/除碳系统
  safety:       [NORMAL, ALERT]        # 安全监控状态
  greenhouse:   [IDLE, WATERING, LIGHTING]  # 温室种植系统

# 初始状态
initial_states:
  thermal: IDLE
  vacuum: IDLE
  arm: IDLE
  life_support: IDLE
  safety: NORMAL
  greenhouse: IDLE

# 联锁规则（跨子系统安全约束）
# condition: 安全求值布尔表达式（变量 = 子系统状态 + 遥测值）
# message: 拦截时的人类可读消息
# scope: 可选，仅对指定 tool 生效（省略 = 全局）
interlocks:
  # ── 原有联锁规则 ── #

  # 真空激活时禁止移动机械臂
  - condition: "vacuum == 'ACTIVE' and arm == 'MOVING'"
    message: "联锁: 真空激活时禁止移动机械臂"

  # 机械臂运动中禁止启动加热
  - condition: "arm == 'MOVING' and thermal == 'HEATING'"
    message: "联锁: 机械臂运动中禁止启动加热"

  # 温度过高时全局禁止操作（遥测变量）
  - condition: "temperature >= 80"
    message: "联锁: 温度 >= 80℃，安全停机"

  # 低压下禁止移动机械臂（遥测变量 + scope 过滤）
  - condition: "pressure < 50"
    message: "联锁: 低压 (< 50 kPa) 下禁止移动机械臂"
    scope: move_robotic_arm

  # ── V7.1 新增联锁规则 ── #

  # 【安全-燃烧】CO2 浓度过高时禁止任何燃烧相关实验
  - condition: "co2_level >= 1000.0"
    message: "联锁: CO2 浓度 >= 1000.0ppm，禁止燃烧实验（激光/加热）"
    scope: turn_on_laser

  - condition: "co2_level >= 1000.0"
    message: "联锁: CO2 浓度 >= 1000.0ppm，禁止启动加热"
    scope: set_temperature

  # 【安全-火情】烟雾或火焰检测时强制停机
  - condition: "smoke_level > 0.1"
    message: "联锁: 烟雾检测到 (smoke_level > 0.1)，强制停机"
    scope: move_robotic_arm

  - condition: "flame_detected == 1"
    message: "联锁: 火焰检测到 (flame_detected == 1)，强制停机"

  # 【安全-全局】火情时禁止所有危险操作
  - condition: "(smoke_level > 0.1 or flame_detected == 1) and safety == 'NORMAL'"
    message: "联锁: 火情报警激活，安全系统必须切换到 ALERT 状态"

  # 【温室-灌溉】禁止在非 WATERING 状态下注入营养液
  - condition: "greenhouse != 'WATERING' and greenhouse != 'IDLE'"
    message: "联锁: 温室系统必须在 IDLE 或 WATERING 状态下才能注入营养液"
    scope: inject_nutrient

  # 【生命支持】高 CO2 时通风系统必须激活
  - condition: "co2_level >= 800.0 and life_support == 'IDLE'"
    message: "联锁: CO2 浓度 >= 800.0ppm，生命支持系统应切换到 VENTILATING"

  # 【安全-机械臂】高温舱内禁止精密操作
  - condition: "temperature >= 60 and arm == 'MOVING'"
    message: "联锁: 温度 >= 60℃，高温环境下禁止机械臂精密操作"
    scope: move_robotic_arm

# ── 物理模拟参数 (V7.1) ── #
# 这些参数用于 MCP Tools 的物理运动学计算
physics_params:
  robotic_arm:
    max_speed_deg_per_sec: 15.0    # 机械臂最大角速度
    max_angle: 180.0               # 最大旋转角度

  temperature:
    rate_deg_per_sec: 2.0          # 升/降温速率 (℃/秒)

  nutrient_pump:
    flow_rate_ml_per_sec: 20.0      # 营养液泵速 (mL/秒)

  vacuum_pump:
    fixed_duration_sec: 4.0         # 抽真空/恢复常压固定耗时
