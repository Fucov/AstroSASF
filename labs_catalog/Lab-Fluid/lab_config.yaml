# Lab-Fluid 流体实验舱配置

name: Lab-Fluid
description: 流体实验舱 — 微重力流体物理实验

subsystems:
  pump:
    - OFF
    - FORWARD
    - REVERSE
  valve:
    - CLOSED
    - OPEN_A
    - OPEN_B
    - MIXING
  pressure_sensor:
    - IDLE
    - MEASURING
  centrifuge:
    - STOPPED
    - SPINNING
    - BRAKING

initial_states:
  pump: OFF
  valve: CLOSED
  pressure_sensor: IDLE
  centrifuge: STOPPED

interlocks:
  # 泵运行时禁止切换阀门
  - condition: "pump == 'FORWARD' or pump == 'REVERSE'"
    message: "泵运行时禁止切换阀门"
    scope: control_valve

  # 离心机停止前禁止开门
  - condition: "centrifuge == 'BRAKING'"
    message: "离心机刹车中，请等待完全停止"
    scope: open_centrifuge_door

macros:
  quick_flow:
    target: control_pump
    preset:
      direction: FORWARD
      flow_rate: 50
    description: "快速启动50%流速泵送"

skills:
  - fluid_experiment
